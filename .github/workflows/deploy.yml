name: Build and Deploy

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - frontend-main-updated

env:
  DEPLOY_IMAGE: ghcr.io/davis-wiki-revival/davispedia-backend:latest
  IMAGE_ARCHIVE: davispedia-backend.tar.gz

jobs:
  build-and-deploy:
    name: Build & Deploy to DigitalOcean
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          FRONTEND_REF="${{ github.event.client_payload.frontend_sha }}"

          if [ -z "${FRONTEND_REF}" ]; then
            FRONTEND_REF="main"
          fi

          echo "Building with frontend ref: ${FRONTEND_REF}"

          docker build \
            --build-arg FRONTEND_REF="${FRONTEND_REF}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.davispedia.frontend.revision=${FRONTEND_REF}" \
            -t "${DEPLOY_IMAGE}" \
            .
      - name: Export Docker image
        run: |
          docker save "${DEPLOY_IMAGE}" | gzip -1 > "${IMAGE_ARCHIVE}"
          ls -lh "${IMAGE_ARCHIVE}"
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_TAILSCALE_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "compose.prod.yml,davispedia-backend.tar.gz"
          target: ${{ secrets.DEPLOY_PATH }}


      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_TAILSCALE_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            cd "${{ secrets.DEPLOY_PATH }}"

            echo "Validating Compose configuration..."
            docker compose -f compose.prod.yml config --quiet

            echo "Loading new Docker image..."
            gzip -dc "${{ env.IMAGE_ARCHIVE }}" | docker load

            echo "Removing transferred image archive..."
            rm -f "${{ env.IMAGE_ARCHIVE }}"

            echo "Deploying containers..."
            docker compose -f compose.prod.yml up -d --pull never

            echo "Deployment status:"
            docker compose -f compose.prod.yml ps